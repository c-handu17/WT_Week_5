<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h2> Student Registration Form</h2>
    <form action="#" method="post">
        <label>Full Name :</label>
        <input type="text" name="name" required><br><br>

        <label>Last Name :</label>
        <input type="text" name="name" required><br><br>

        <label>Gender :</label>
        <input type="radio" name="gender" required value="M"> Male
        <input type="radio" name="gender" required value="F">Female<br><br>

        <label>Date of Birth :</label>
        <input type="date" name="dob" required><br><br>

        <label>Email :</label>
        <input type="email" name="email" required><br><br>

        <label>Password :</label>
        <input type="password" name="pwd" required><br><br>

        <label>Courses :</label>
        <input type="checkbox" name="course" required value="PP"> Python Programming
        <input type="checkbox" name="course" required value="MFAI"> Maths with Foundation of AI
        <input type="checkbox" name="course" required value="COAS"> COAS
        <input type="checkbox" name="course" required value="DS"> Data Structures
        <input type="checkbox" name="course" required value="web"> Web Technology
        <input type="checkbox" name="course" required value="Tec"> TEC
        <input type="checkbox" name="course" required value="SE"> SE<br><br>

        <label>Country :</label>
        <select name="country">
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
        </select><br><br>

        <input type="submit" name="submit" required>
        <input type="reset" name="Reset" required><br><br>
    
    </form>

</body>
</html>
